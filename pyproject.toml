[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ste100-linter"
version = "0.1.0"
description = "An ASD-STE100 Simplified Technical English linter for Markdown and CSV."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
# NOTICE and THIRD-PARTY-LICENSES.md are listed here, not just kept in the
# repo: the shipped word lists in src/ste100/data/ are partly derived from
# MIT- and BSD-3-Clause-licensed projects, whose terms require the copyright
# notice and license text to travel with every redistribution. A wheel is a
# redistribution, so both files have to be inside it.
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-LICENSES.md"]
authors = [{ name = "Firelight Innovations" }]
keywords = [
    "ste100", "asd-ste100", "simplified-technical-english", "linter",
    "technical-writing", "documentation", "requirements", "plain-language",
    "style-checker", "markdown",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Markup :: Markdown",
]

# Intentionally empty, and a project constraint rather than an oversight: the
# linter must run anywhere Python does, with no build step and no supply chain.
dependencies = []

[project.urls]
Homepage = "https://github.com/Firelight-Innovations/STE-Linter"
Repository = "https://github.com/Firelight-Innovations/STE-Linter"
Documentation = "https://github.com/Firelight-Innovations/STE-Linter/wiki"
Issues = "https://github.com/Firelight-Innovations/STE-Linter/issues"
Changelog = "https://github.com/Firelight-Innovations/STE-Linter/blob/main/CHANGELOG.md"

[project.scripts]
ste100 = "ste100.cli:run"
# The HELVE-ADE tool core, speaking JSON-RPC over stdio. The helve-tool.toml
# manifest points at bin/ste100-helve.cmd and does not need this, but an
# installed copy is useful for testing the server by hand.
ste100-helve = "ste100.helve:main"

# The rule tables (data/) and presets/ live inside the package directory, so
# they are picked up automatically -- the linter cannot run without them and
# must never depend on files sitting beside the install.
[tool.hatch.build.targets.wheel]
packages = ["src/ste100"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/NOTICE",
    "/THIRD-PARTY-LICENSES.md",
]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
